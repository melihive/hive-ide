[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-ide"
version = "1.0.17"
description = "An agent-aware tmux workspace for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Meli Hive"}]
keywords = ["ai-agents", "claude-code", "codex", "terminal", "tmux"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
release = ["build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://github.com/melihive/hive-ide"
Changelog = "https://github.com/melihive/hive-ide/blob/main/CHANGELOG.md"
Issues = "https://github.com/melihive/hive-ide/issues"
Source = "https://github.com/melihive/hive-ide"

[project.scripts]
hive-ide = "hive_ide.cli:main"

[project.entry-points."hive_ide.drivers"]

[project.entry-points."hive_ide.sidebar_providers"]

[tool.setuptools.packages.find]
include = ["hive_ide*"]

[tool.setuptools.package-data]
hive_ide = ["skill_definition/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
